name: Deploy

on:
  push:
    branches: [main]

# Keep production deploys serialized so remote staging and rollback paths never race.
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.actor != 'dependabot[bot]' &&
      !(contains(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/dependabot/'))

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/prepare
      - name: Setup Frontend Environment Variables
        env:
          VITE_API_ENDPOINT: ${{ secrets.VITE_API_ENDPOINT }}
          VITE_APP_DESCRIPTION: ${{ secrets.VITE_APP_DESCRIPTION }}
          VITE_APP_TITLE: ${{ secrets.VITE_APP_TITLE }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_SENTRY_DNS: ${{ secrets.VITE_SENTRY_DNS }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          {
            printf '%s=%s\n' "VITE_APP_TITLE" "$VITE_APP_TITLE"
            printf '%s=%s\n' "VITE_APP_DESCRIPTION" "$VITE_APP_DESCRIPTION"
            printf '%s=%s\n' "VITE_API_ENDPOINT" "$VITE_API_ENDPOINT"
            printf '%s=%s\n' "VITE_SENTRY_DSN" "$VITE_SENTRY_DSN"
            printf '%s=%s\n' "VITE_SENTRY_DNS" "$VITE_SENTRY_DNS"
            printf '%s=%s\n' "VITE_SENTRY_RELEASE" "$VITE_SENTRY_RELEASE"
            printf '%s=%s\n' "VITE_GA_MEASUREMENT_ID" "$VITE_GA_MEASUREMENT_ID"
          } > .env.prod

      - name: Build frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          pnpm build
          rm -f build/mockServiceWorker.js

      - name: Build backend
        run: pnpm server:build

      # `pnpm pm deploy` is required because package.json has a `deploy` script
      # (rsync helper). pnpm 11 runs that script for `pnpm deploy` instead of
      # the built-in packager. `pm` must follow `pnpm` immediately; global flags
      # before `pm` (e.g. `--prod`) are parsed as script options and fail.
      # `--legacy` re-resolves without the lockfile, so minimum-release-age would
      # block any package published within that window.
      - name: Deploy server package with dependencies
        run: pnpm pm --config.minimum-release-age=0 --filter=@nsx/server deploy --legacy --prod .deploy-server

      - name: Create artifact
        run: |
          mkdir -p deploy
          cp -r build/ deploy/
          cp -r server_build/ deploy/
          cp -r .deploy-server/node_modules/ deploy/
          cp -r prisma/ deploy/
          cp prisma.config.ts deploy/
          cp package.json deploy/
          cp ecosystem.config.js deploy/
          cp compose.yml deploy/
          cp compose.prod.yml deploy/
          cp -r scripts/ deploy/
          mkdir -p deploy/run/mysqld
          cp run/mysqld/.gitkeep deploy/run/mysqld/
          # Store hard-linked dependencies as regular files so remote tar can extract into empty staging.
          tar --hard-dereference -czf "deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz" -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-files
          path: deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-files
          path: .

      - name: Deploy to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          target: '/tmp'
          debug: true

      # GitHub secrets are the only source of production credentials: every deploy
      # re-writes them into the server .env, so nobody keeps a local copy. To rotate,
      # `gh secret set <NAME>` and redeploy (MySQL passwords are applied via ALTER USER).
      - name: Extract and restart server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          NSX_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          NSX_BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          NSX_BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          NSX_LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          NSX_MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          NSX_MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          NSX_MYSQL_USER: ${{ secrets.MYSQL_USER }}
          NSX_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NSX_REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          NSX_REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          NSX_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NSX_SENTRY_RELEASE: ${{ github.sha }}
          NSX_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NSX_ACCESS_TOKEN_SECRET,NSX_BLUESKY_PASSWORD,NSX_BLUESKY_USERNAME,NSX_LOG_LEVEL,NSX_MYSQL_PASSWORD,NSX_MYSQL_ROOT_PASSWORD,NSX_MYSQL_USER,NSX_OPENAI_API_KEY,NSX_REFRESH_TOKEN_SECRET,NSX_REMOTE_DIR,NSX_SENTRY_DSN,NSX_SENTRY_RELEASE,NSX_SENTRY_TRACES_SAMPLE_RATE
          script: |
            set -eu

            remote_dir="$NSX_REMOTE_DIR"
            remote_archive="/tmp/deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz"
            staging_dir="/tmp/nsx-deploy-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
            rollback_dir="${remote_dir%/}.rollback"
            health_url="https://nsx.malloc.tokyo/api/health"
            db_container="nsx-db-1"
            deployment_applied="false"
            rollback_ready="false"
            credentials_changed="false"

            cleanup() {
              if [ -d "$staging_dir" ]; then
                case "$staging_dir" in
                  /tmp/nsx-deploy-*) rm -rf "$staging_dir" ;;
                  *) echo "::warning::Skipped cleanup for unexpected staging path: $staging_dir" ;;
                esac
              fi
              rm -f "$remote_archive"
            }

            reset_staging_dir() {
              case "$staging_dir" in
                /tmp/nsx-deploy-*) ;;
                *)
                  echo "::error::Refusing to reset unexpected staging path: $staging_dir"
                  return 1
                  ;;
              esac

              # Recreate staging wholesale because node_modules hardlinks can make find -delete race itself.
              rm -rf "$staging_dir" || return 1
              mkdir -p "$staging_dir" || return 1
            }

            require_command() {
              command -v "$1" >/dev/null 2>&1 || {
                echo "::error::Required command is missing: $1"
                cleanup
                exit 1
              }
            }

            quote_env_value() {
              value="$1"
              printf '%s' "$value" | sed ':a;N;$!ba;s/\\/\\\\/g; s/"/\\"/g; s/\n/\\n/g'
            }

            write_env_line() {
              key="$1"
              value="$2"
              escaped_value=$(quote_env_value "$value") || return 1
              printf '%s="%s"\n' "$key" "$escaped_value"
            }

            set_env_value() {
              key="$1"
              value="$2"

              # Empty optional deploy variables should not erase existing production values.
              if [ -z "$value" ]; then
                return 0
              fi

              temp_env_file=$(mktemp "$remote_dir/.env.XXXXXX") || return 1
              awk -v env_key="$key" 'index($0, env_key "=") != 1 { print }' "$remote_dir/.env" > "$temp_env_file" || {
                rm -f "$temp_env_file"
                return 1
              }
              write_env_line "$key" "$value" >> "$temp_env_file" || {
                rm -f "$temp_env_file"
                return 1
              }
              chmod 600 "$temp_env_file" || {
                rm -f "$temp_env_file"
                return 1
              }
              mv "$temp_env_file" "$remote_dir/.env"
            }

            require_secret() {
              name="$1"
              value="$2"

              # Missing secrets must stop the deploy before anything on the server changes.
              if [ -z "$value" ]; then
                echo "::error::GitHub secret $name is missing or empty"
                cleanup
                exit 1
              fi

              # dotenv does not unescape \\ or \" inside double quotes, so such values would not round-trip.
              if printf '%s' "$value" | grep -q '["\\]' || [ "$(printf '%s' "$value" | wc -l)" -ne 0 ]; then
                echo "::error::GitHub secret $name must not contain quotes, backslashes or newlines"
                cleanup
                exit 1
              fi
            }

            require_db_secret() {
              require_secret "$1" "$2"

              # DB credentials are embedded in SQL and in the DATABASE_URL, so keep them URL/SQL-safe.
              if ! printf '%s' "$2" | grep -Eq '^[A-Za-z0-9._~-]+$'; then
                echo "::error::GitHub secret $1 may only contain [A-Za-z0-9._~-]"
                cleanup
                exit 1
              fi
            }

            read_env_value() {
              # write_env_line wraps values in double quotes; older hand-written lines may be bare.
              sed -n "s/^$1=//p" "$remote_dir/.env" | tail -n 1 | sed 's/^"\(.*\)"$/\1/'
            }

            mysql_as() {
              user="$1"
              password="$2"
              # MYSQL_PWD keeps the password out of the host process list; SQL comes from stdin.
              docker exec -i -e MYSQL_PWD="$password" "$db_container" mysql -u"$user" -N --batch
            }

            mysql_accepts() {
              printf 'SELECT 1;\n' | mysql_as "$1" "$2" >/dev/null 2>&1
            }

            sync_mysql_passwords() {
              # A fresh server initializes MySQL from .env on first `docker compose up`, so nothing to rotate yet.
              if [ "$(docker inspect -f '{{.State.Running}}' "$db_container" 2>/dev/null || true)" != "true" ]; then
                echo "::warning::$db_container is not running; skipping MySQL password sync"
                return 0
              fi

              if mysql_accepts root "$NSX_MYSQL_ROOT_PASSWORD"; then
                root_password="$NSX_MYSQL_ROOT_PASSWORD"
              else
                # First deploy after rotating the secret: MySQL still has the password currently in .env.
                root_password=$(read_env_value MYSQL_ROOT_PASSWORD)
                if [ -z "$root_password" ] || ! mysql_accepts root "$root_password"; then
                  echo "::error::MySQL rejected both the new and the current root password"
                  return 1
                fi
              fi

              # Nothing to do when MySQL already accepts every password from GitHub secrets.
              if [ "$root_password" = "$NSX_MYSQL_ROOT_PASSWORD" ] && mysql_accepts "$NSX_MYSQL_USER" "$NSX_MYSQL_PASSWORD"; then
                return 0
              fi

              # MySQL keeps passwords in its data volume (MYSQL_* env only applies at init), so rotate in place.
              echo "Rotating MySQL passwords to the values from GitHub secrets"
              credentials_changed="true"
              printf "ALTER USER 'root'@'%%' IDENTIFIED BY '%s';\nALTER USER IF EXISTS 'root'@'localhost' IDENTIFIED BY '%s';\nALTER USER '%s'@'%%' IDENTIFIED BY '%s';\n" \
                "$NSX_MYSQL_ROOT_PASSWORD" "$NSX_MYSQL_ROOT_PASSWORD" "$NSX_MYSQL_USER" "$NSX_MYSQL_PASSWORD" \
                | mysql_as root "$root_password"
            }

            write_production_env() {
              # One entry per secret; values always come from GitHub, never from the existing server file.
              set_env_value "DATABASE_URL" "mysql://root:${NSX_MYSQL_ROOT_PASSWORD}@localhost/digital?socketPath=${remote_dir%/}/run/mysqld/mysqld.sock" &&
                set_env_value "MYSQL_ROOT_PASSWORD" "$NSX_MYSQL_ROOT_PASSWORD" &&
                set_env_value "MYSQL_USER" "$NSX_MYSQL_USER" &&
                set_env_value "MYSQL_PASSWORD" "$NSX_MYSQL_PASSWORD" &&
                set_env_value "ACCESS_TOKEN_SECRET" "$NSX_ACCESS_TOKEN_SECRET" &&
                set_env_value "REFRESH_TOKEN_SECRET" "$NSX_REFRESH_TOKEN_SECRET" &&
                set_env_value "OPENAI_API_KEY" "$NSX_OPENAI_API_KEY" &&
                set_env_value "BLUESKY_USERNAME" "$NSX_BLUESKY_USERNAME" &&
                set_env_value "BLUESKY_PASSWORD" "$NSX_BLUESKY_PASSWORD" &&
                set_env_value "SENTRY_DSN" "$NSX_SENTRY_DSN" &&
                set_env_value "SENTRY_RELEASE" "$NSX_SENTRY_RELEASE" &&
                set_env_value "SENTRY_TRACES_SAMPLE_RATE" "$NSX_SENTRY_TRACES_SAMPLE_RATE" &&
                set_env_value "LOG_LEVEL" "$NSX_LOG_LEVEL"
            }

            verify_deployment() {
              attempt=1
              while [ "$attempt" -le 5 ]; do
                status=$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "$health_url" || printf '000')
                if [ "$status" = "200" ]; then
                  echo "Health check passed with status 200"
                  return 0
                fi
                echo "Health check attempt ${attempt} failed with status ${status}"
                attempt=$((attempt + 1))
                sleep 5
              done
              return 1
            }

            rollback_deployment() {
              echo "::warning::Rolling back to previous deployment artifacts"
              if [ "$rollback_ready" != "true" ]; then
                echo "::error::Rollback skipped because no previous artifacts were captured"
                return 1
              fi

              # Anchored excludes ('/'-prefixed) protect top-level .env/logs/run plus the root-owned
              # node_modules/.cache the non-root rsync can't delete (see artifact-sync rsync, exit 23).
              rsync -a --delete --exclude='/.env' --exclude='/logs/' --exclude='/run/' --exclude='/node_modules/.cache/' "$rollback_dir"/ "$remote_dir"/
              cd "$remote_dir"
              if sudo pm2 describe server >/dev/null 2>&1; then
                sudo pm2 reload ecosystem.config.js --update-env
              else
                sudo pm2 start ecosystem.config.js
              fi
              if ! verify_deployment; then
                echo "::error::Rollback health check failed"
                return 1
              fi
            }

            capture_rollback_artifacts() {
              set +e
              # Anchored excludes ('/'-prefixed) protect top-level .env/logs/run plus the root-owned
              # node_modules/.cache the non-root rsync can't delete (see artifact-sync rsync, exit 23).
              rsync -a --delete --exclude='/.env' --exclude='/logs/' --exclude='/run/' --exclude='/node_modules/.cache/' "$remote_dir"/ "$rollback_dir"/
              rollback_status=$?
              set -e

              if [ "$rollback_status" -eq 0 ]; then
                return 0
              fi

              if [ "$rollback_status" -eq 24 ]; then
                # Exit 24 means rsync saw a transient file disappear; the deploy can still proceed.
                echo "::warning::Rollback capture saw vanished files; continuing with best-effort rollback artifacts"
                return 0
              fi

              echo "::warning::Rollback capture failed with rsync exit ${rollback_status}; continuing without rollback"
              return 1
            }

            run_prisma_cli() {
              # Run Prisma through Node so deploys do not depend on executable bits in unpacked artifacts.
              node ./node_modules/prisma/build/index.js "$@"
            }

            fail_deployment() {
              message="$1"
              echo "::error::$message"
              if [ "$deployment_applied" = "true" ]; then
                rollback_deployment || true
              elif [ "$credentials_changed" = "true" ]; then
                # MySQL now rejects the old passwords, so restart the current release to load the new .env.
                echo "::warning::Restarting the current release so it picks up the rotated credentials"
                (cd "$remote_dir" && sudo pm2 reload ecosystem.config.js --update-env) || true
              fi
              cleanup
              exit 1
            }

            require_command curl
            require_command docker
            require_command find
            require_command node
            require_command rsync
            require_command tar

            require_secret ACCESS_TOKEN_SECRET "$NSX_ACCESS_TOKEN_SECRET"
            require_secret REFRESH_TOKEN_SECRET "$NSX_REFRESH_TOKEN_SECRET"
            require_secret OPENAI_API_KEY "$NSX_OPENAI_API_KEY"
            require_secret BLUESKY_USERNAME "$NSX_BLUESKY_USERNAME"
            require_secret BLUESKY_PASSWORD "$NSX_BLUESKY_PASSWORD"
            require_db_secret MYSQL_ROOT_PASSWORD "$NSX_MYSQL_ROOT_PASSWORD"
            require_db_secret MYSQL_USER "$NSX_MYSQL_USER"
            require_db_secret MYSQL_PASSWORD "$NSX_MYSQL_PASSWORD"

            mkdir -p "$remote_dir" "$rollback_dir" "$remote_dir/run/mysqld" "$remote_dir/logs" || fail_deployment "Failed to prepare deployment directories"
            reset_staging_dir || fail_deployment "Failed to prepare staging directory"
            tar -xzf "$remote_archive" -C "$staging_dir" || fail_deployment "Failed to extract deployment artifact"

            if [ -d "$remote_dir/build" ] || [ -d "$remote_dir/server_build" ]; then
              if capture_rollback_artifacts; then
                rollback_ready="true"
              fi
            else
              echo "::warning::No previous deployment artifacts found; rollback will be unavailable"
            fi

            if [ ! -f "$remote_dir/.env" ]; then
              install -m 600 /dev/null "$remote_dir/.env" || fail_deployment "Failed to create production .env"
            fi

            # Rotate MySQL first: it reads the current root password from .env before .env is overwritten.
            sync_mysql_passwords || fail_deployment "Failed to sync MySQL passwords"
            write_production_env || fail_deployment "Failed to write production .env"
            cp "$remote_dir/.env" "$staging_dir/.env" || fail_deployment "Failed to stage production .env for Prisma"

            (
              cd "$staging_dir"
              # Pending migrations make `status` non-zero, but drift/failed states should stop before deploy.
              set +e
              migration_status_output=$(run_prisma_cli migrate status 2>&1)
              migration_status_code=$?
              set -e
              printf '%s\n' "$migration_status_output"
              if [ "$migration_status_code" -ne 0 ]; then
                case "$migration_status_output" in
                  *"not yet been applied"* | *"pending migrations"*)
                    echo "::notice::Pending Prisma migrations detected; migrate deploy will apply them"
                    ;;
                  *)
                    echo "::error::Prisma migration status reported an unsafe state"
                    exit "$migration_status_code"
                  ;;
              esac
              fi
              run_prisma_cli migrate deploy
            ) || fail_deployment "Prisma migration failed; PM2 restart skipped"

            # Prisma may touch generated client files during migration; re-extract a clean artifact before rsync.
            reset_staging_dir || fail_deployment "Failed to clear migration staging directory"
            tar -xzf "$remote_archive" -C "$staging_dir" || fail_deployment "Failed to re-extract clean deployment artifact"

            # Anchor excludes with a leading '/' so they shield ONLY top-level runtime state
            # (.env, logs/, run/). Unanchored patterns also matched deep node_modules dirs
            # named logs/, protecting stale nested @sentry trees from --delete → rsync exit 23.
            # /node_modules/.cache/ holds jiti's compiled prisma.config cache. A manual root deploy
            # writes it root-owned, so this non-root Actions rsync can't --delete it → exit 23; skip it.
            rsync -a --delete --exclude='/.env' --exclude='/logs/' --exclude='/run/' --exclude='/node_modules/.cache/' "$staging_dir"/ "$remote_dir"/ || fail_deployment "Failed to sync deployment artifact"
            deployment_applied="true"

            cd "$remote_dir"
            mkdir -p run/mysqld logs || fail_deployment "Failed to recreate runtime directories"
            if sudo pm2 describe server >/dev/null 2>&1; then
              sudo pm2 reload ecosystem.config.js --update-env || fail_deployment "PM2 reload failed"
            else
              sudo pm2 start ecosystem.config.js || fail_deployment "PM2 start failed"
            fi
            sudo pm2 save || fail_deployment "PM2 save failed"

            sleep 5
            verify_deployment || fail_deployment "Deployment health check failed"
            cleanup

      - name: Report deploy status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="failure"
          description="Production deployment failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Production deployment succeeded"
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"${state}\",\"context\":\"deploy/production\",\"description\":\"${description}\",\"target_url\":\"https://nsx.malloc.tokyo/\"}"
