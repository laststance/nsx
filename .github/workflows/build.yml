name: Build
on:
  pull_request: ~
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - name: Setup .env
        run: |
          cp .env.sample .env
          cp .env.sample .env.prod
      - name: Build
        run: pnpm build
